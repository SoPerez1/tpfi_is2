[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TPFI_IS2"
dynamic = ["version"]
description = "Python Boilerplate contains all the boilerplate you need to create a Python package."
readme = "README.md"
authors = [
  {name = "Jesus Arevalo", email = "jesusemanuelarevalo@gmail.com"}
]
maintainers = [
  {name = "Jesus Arevalo", email = "jesusemanuelarevalo@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "boto3>=1.34.0",
]
requires-python = ">= 3.10"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
    { include-group = "security" },
]
lint = [
    "ruff>=0.3.0",
    "black>=24.0.0",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
    "mypy>=1.9.0",
    "pyright>=1.1.350",
]
security = [
    "bandit>=1.7.8",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/SoPerez1/TPFI_IS2/issues"
changelog = "https://github.com/SoPerez1/TPFI_IS2/releases"
documentation = "https://SoPerez1.github.io/TPFI_IS2/"
homepage = "https://github.com/SoPerez1/TPFI_IS2"

[project.scripts]
tpfi_is2 = "tpfi_is2.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120
exclude = [
    "tests/sources",
    "src/IS2_TPFI_test.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/tpfi_is2"]
omit = [
    "*/cli.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
omit = [
    "*/cli.py",
    "*/__main__.py",
]
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["tests/sources"]


[tool.hatch.build.targets.wheel]
packages = ["src/tpfi_is2"]

[tool.uv]
package = true
default-groups = ["dev"]

# The application package and its three executable entry points are in scope.
# cli.py / __main__.py are unused Cookiecutter scaffolding.
[tool.black]
line-length = 120
target-version = ["py310"]
force-exclude = 'tests/sources/|src/IS2_TPFI_test.py'

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
files = ["src/tpfi_is2", "singletonclient.py", "observerclient.py", "singletonproxyobserver.py"]
exclude = ['src/tpfi_is2/(cli|__main__)\.py$']
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src/tpfi_is2", "singletonclient.py", "observerclient.py", "singletonproxyobserver.py"]
exclude = ["src/tpfi_is2/cli.py", "src/tpfi_is2/__main__.py"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.hatch.version]
path = "src/tpfi_is2/version.py"
