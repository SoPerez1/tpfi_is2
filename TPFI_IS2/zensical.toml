[project]
site_name = "TPFI_IS2"
site_url = "https://SoPerez1.github.io/TPFI_IS2/"
repo_url = "https://github.com/SoPerez1/TPFI_IS2"
repo_name = "SoPerez1/TPFI_IS2"

nav = [
  { "Inicio" = "index.md" },
  { "Instalación" = "installation.md" },
  { "Uso" = "usage.md" },
  { "Protocolo HTTP" = "protocolo_http.md" },
  { "Diagramas UML" = "diagramas_uml.md" },
  { "Informe" = "informe_tpfi.md" },
  { "Validación AWS" = "validacion_aws.md" },
  { "Referencia de la API" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
